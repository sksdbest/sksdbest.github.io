name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '42 3 * * 6'
  workflow_dispatch:

jobs:
  detect-languages:
    name: Detect languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Detect CodeQL-supported languages
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CodeQL-supported languages (as of CodeQL v3)
          SUPPORTED='["actions","c-cpp","csharp","go","java-kotlin","javascript-typescript","python","ruby","swift"]'

